[package]
name = "codex-home-guard"
version = "1.4.1"
edition = "2024"
rust-version = "1.88"
description = "A fast Codex PreToolUse hook that blocks catastrophic filesystem commands"
license = "MIT"
repository = "https://github.com/ardasevinc/agent-devtools"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
