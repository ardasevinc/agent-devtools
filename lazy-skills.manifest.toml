version = 1

[runtime]
root = "~/.agents/lazy-skills"
source_cache = "~/.agents/lazy-skill-sources"
managed_by = "agent-devtools.lazy-skills"

[defaults]
update_policy = "track-ref"
include = [
  "README*",
  "LICENSE*",
  "CLAUDE.md",
  "AGENTS.md",
  "GEMINI.md",
  "CONTEXT.md",
  "CHANGELOG.md",
  "UPSTREAM-README.md",
  "SKILL.md",
  "skills/**/SKILL.md",
  "skills/**/*.md",
  "skills/**/README*",
  "skills/**/references/**",
  "skills/**/rules/**",
  "skills/**/assets/**",
  "skills/**/scripts/**",
  "plugins/**/skills/**/SKILL.md",
  "plugins/**/skills/**/*.md",
  "plugins/**/skills/**/references/**",
  "plugins/**/skills/**/rules/**",
  "plugins/**/skills/**/assets/**",
  "plugins/**/skills/**/scripts/**",
  "references/**",
  "rules/**",
  "assets/**",
  "scripts/**",
  "docs/**",
  "_meta/**",
  "agents/**",
  "cache/**",
  "tests/**",
  "metadata.json",
  "test-triggers.*"
]
exclude = [
  ".git/**",
  ".github/**",
  "node_modules/**",
  ".venv/**",
  "venv/**",
  "dist/**",
  "build/**",
  ".next/**",
  "coverage/**",
  "target/**",
  ".turbo/**",
  ".cache/**"
]

