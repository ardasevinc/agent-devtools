version = 1

[runtime]
root = "~/.agents/lazy-skills"
source_cache = "~/.agents/lazy-skill-sources"
managed_by = "agent-devtools.lazy-skills"

[defaults]
update_policy = "track-ref"
include = [
  "README*",
  "LICENSE*",
  "CLAUDE.md",
  "AGENTS.md",
  "GEMINI.md",
  "CONTEXT.md",
  "CHANGELOG.md",
  "UPSTREAM-README.md",
  "SKILL.md",
  "skills/**/SKILL.md",
  "skills/**/*.md",
  "skills/**/README*",
  "skills/**/references/**",
  "skills/**/rules/**",
  "skills/**/assets/**",
  "skills/**/scripts/**",
  "plugins/**/skills/**/SKILL.md",
  "plugins/**/skills/**/*.md",
  "plugins/**/skills/**/references/**",
  "plugins/**/skills/**/rules/**",
  "plugins/**/skills/**/assets/**",
  "plugins/**/skills/**/scripts/**",
  "references/**",
  "rules/**",
  "assets/**",
  "scripts/**",
  "docs/**",
  "_meta/**",
  "agents/**",
  "cache/**",
  "tests/**",
  "metadata.json",
  "test-triggers.*"
]
exclude = [
  ".git/**",
  ".github/**",
  "node_modules/**",
  ".venv/**",
  "venv/**",
  "dist/**",
  "build/**",
  ".next/**",
  "coverage/**",
  "target/**",
  ".turbo/**",
  ".cache/**"
]

[[source]]
name = "app-store-connect-cli-skills"
kind = "collection"
repo = "https://github.com/rorkai/app-store-connect-cli-skills.git"
ref = "main"
runtime_path = "app-store-connect-cli-skills"

[[source]]
name = "architecture-wise-tree"
kind = "curated"
runtime_path = "architecture-wise-tree"
note = "Curated architecture bundle from declared upstream sources plus a local wrapper README."

[[source.parts]]
source_path = "lazy-skills/architecture-wise-tree"
from = "."
to = "."
include = ["README.md"]

[[source.parts]]
repo = "https://github.com/addyosmani/agent-skills.git"
ref = "b76534301587b9e75ad9cf5fdc1cd6cbe6318da3"
from = "skills"
to = "addyosmani"
include = [
  "code-simplification/**",
  "documentation-and-adrs/**",
  "incremental-implementation/**",
  "planning-and-task-breakdown/**",
  "source-driven-development/**"
]

[[source.parts]]
repo = "https://github.com/anthropics/knowledge-work-plugins.git"
ref = "main"
from = "engineering/skills"
to = "anthropics"
include = [
  "architecture/**",
  "tech-debt/**",
  "testing-strategy/**"
]

[[source.parts]]
repo = "https://github.com/github/awesome-copilot.git"
ref = "main"
from = "skills"
to = "github"
include = [
  "architecture-blueprint-generator/**",
  "cloud-design-patterns/**"
]

[[source.parts]]
repo = "https://github.com/wondelai/skills.git"
ref = "4d322538be8b9ce98fca29b0eef26d67bff1fe82"
from = "."
to = "wondelai"
include = [
  "clean-architecture/**",
  "ddia-systems/**",
  "domain-driven-design/**",
  "pragmatic-programmer/**",
  "refactoring-patterns/**",
  "software-design-philosophy/**",
  "system-design/**"
]

